{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить заявку — Aeterna</title>
    <link rel="stylesheet" href="{% static 'css/normalize.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.svg' %}" type="image/x-icon">
    <!-- <script src="{% static 'js/request.js' %}" defer></script> -->
</head>
<body>
    <main class="request">
        <div class="request__background"></div>
        <div class="request-card">
            <div class="request-card__content">
                <a href="{% url 'home' %}" class="request-card__logo">
                    <img src="{% static 'images/favicon.svg' %}" alt="Aeterna" loading="lazy">
                </a>
                <h1 class="request-card__title">ОСТАВИТЬ ЗАЯВКУ</h1>
                <p class="request-card__subtitle">
                    Заполните форму — и мы свяжемся с вами в удобное время.<br>
                    Ваши данные используются только для обработки этого обращения<br>
                    и не передаются третьим лицам.<br>
                    В Aeterna каждая заявка получает персональное внимание.
                </p>

                <form class="request-card__form" id="request-form" method="POST" action="{% url 'request' %}">
                    {% csrf_token %}
                    
                    <input type="text" id="req-name" name="first_name" class="request-card__input" placeholder="Имя" required>
                    <input type="text" id="req-surname" name="last_name" class="request-card__input" placeholder="Фамилия" required>
                    <input type="tel" id="req-phone" name="phone" class="request-card__input" placeholder="Телефон" required>
                    <input type="email" id="req-email" name="email" class="request-card__input" placeholder="Email" required>

                    <select id="type" name="request_type" class="request-card__select" required>
                        <option value="" disabled selected>Тип заявки</option>
                        <option value="testdrive">Тест-драйв</option>
                        <option value="consult">Консультация</option>
                        <option value="credit">Кредит</option>
                        <option value="tech">Техническое обслуживание</option>
                        <option value="tradein">Trade-in</option>
                    </select>

                    <textarea id="message" name="message" class="request-card__textarea" placeholder="Сообщение или пожелания" rows="4"></textarea>

                    <button type="submit" class="request-card__submit-btn">ОТПРАВИТЬ</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
